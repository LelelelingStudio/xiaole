<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="./xiaole.svg" />
  <link rel="apple-touch-icon" href="./xiaole256.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta name="theme-color" content="#6e8fd6" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小了 SDK · 演示页</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, #f4f8ff, #eaf1ff 55%, #eef6ff);
      color: #2c3550;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: rgba(255,255,255,.8);
      border-radius: 20px;
      padding: 28px 34px;
      box-shadow: 0 12px 32px rgba(80,110,180,.12);
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0; color: #7b869c; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>小了 SDK 测试页</h1>
    <p>点右下角（或左下角）的小了就能聊天</p>
    <p class="hint">URL 加 <code>?anchor=left</code> 可切到左边站位，加 <code>?anchor=right</code> 切回右边；加 <code>?char=layers</code> 看 8 层合成版、<code>?char=frames</code> 看表情帧版</p>
    <p style="margin-top:12px"><button id="demo-wave">让她挥个手</button> <button id="demo-say">让她说句话</button></p>
  </div>

  <style>
    .hint { margin-top: 8px; font-size: 12px; color: #93a0b8; }
    .hint code { background: #eef3ff; padding: 1px 5px; border-radius: 5px; }
    #demo-wave {
      font: inherit; font-size: 13px; cursor: pointer;
      padding: 7px 16px; border-radius: 999px; border: 1px solid #c9d8f5;
      background: #fff; color: #3d55a0;
    }
    #demo-wave:active, #demo-say:active { transform: translateY(1px); }
    #demo-say {
      font: inherit; font-size: 13px; cursor: pointer;
      padding: 7px 16px; border-radius: 999px; border: 1px solid #c9d8f5;
      background: #fff; color: #3d55a0;
    }
  </style>

  <!-- 接入方式：就这一段。站位用 data-anchor="left|right" 让宿主自己选 -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var anchor = (q.get('anchor') || 'right').toLowerCase();
      var char = (q.get('char') || 'rig').toLowerCase();
      var s = document.createElement('script');
      s.src = './sdk/xiaole.js';
      s.setAttribute('data-preset', 'default');
      s.setAttribute('data-size', '210');
      s.setAttribute('data-anchor', anchor === 'left' ? 'left' : 'right');
      // 画法：默认 rig（身体+头两层）；?char=frames 看表情帧版；?char=layers 看 8 层合成版
      if (char !== 'layers' && char !== 'frames') char = 'rig';
      s.setAttribute('data-char', char);
      document.body.appendChild(s);
    })();
  </script>
  <script>
    // 方便验证挥手：SDK 就绪后点按钮触发（对外 API 是 Xiaole.wave()）
    document.getElementById('demo-wave').addEventListener('click', function () {
      if (window.Xiaole && window.Xiaole.wave) window.Xiaole.wave();
    });
    document.getElementById('demo-say').addEventListener('click', function () {
      if (window.Xiaole && window.Xiaole.sayNow) window.Xiaole.sayNow();
    });
  </script>
</body>
</html>
