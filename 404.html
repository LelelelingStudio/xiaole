<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>页面走丢了 · 小了</title>
  <meta name="description" content="这个页面不存在，回到小了首页继续聊。" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/xiaole.svg" />
  <link rel="apple-touch-icon" href="/xiaole256.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#6e8fd6" />
  <style>
    :root {
      --ink: #2c3550;
      --muted: #7b869c;
      --line: #dbe6fa;
      --accent: #4a72c8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, #ffffff 0%, rgba(255, 255, 255, 0) 45%),
        radial-gradient(circle at 82% 78%, #e8f1ff 0%, rgba(232, 241, 255, 0) 50%),
        linear-gradient(160deg, #f4f8ff, #eaf1ff 55%, #eef6ff);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 48px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .cloud {
      position: relative;
      margin: 0 auto 26px;
      width: 176px;
      height: 176px;
      border-radius: 58px 62px 54px 60px / 60px 54px 62px 58px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(80, 110, 180, 0.18), 0 0 0 1px rgba(200, 216, 255, 0.55) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 5.6s ease-in-out infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 12px 26px rgba(80, 110, 180, 0.12);
    }

    .cloud::before {
      width: 62px;
      height: 62px;
      left: -16px;
      bottom: 22px;
    }

    .cloud::after {
      width: 82px;
      height: 82px;
      right: -20px;
      bottom: 12px;
    }

    .cloud span {
      position: relative;
      z-index: 2;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(150deg, #6e8fd6, #9bb8ec);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .code {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 0;
      color: #3f5c9c;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 19px;
      font-weight: 600;
    }

    p {
      margin: 0 0 22px;
      font-size: 13.5px;
      line-height: 1.8;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 13.5px;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-primary {
      background: linear-gradient(150deg, #6e8fd6, #8fb0e8);
      color: #fff;
      box-shadow: 0 10px 24px rgba(110, 143, 214, 0.32);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.9);
      color: var(--accent);
      box-shadow: 0 0 0 1px var(--line) inset;
    }

    .btn:hover { transform: translateY(-2px); }

    .links {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: #9aa7bf;
    }

    .links a {
      color: #6f8dc8;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
    }

    .links a:hover { background: #eaf2ff; }

    footer {
      margin-top: 34px;
      font-size: 11.5px;
      color: #a7b2c8;
    }

    @media (max-width: 420px) {
      .cloud { width: 132px; height: 132px; border-radius: 46px 50px 44px 48px / 48px 44px 50px 46px; }
      .cloud span { font-size: 40px; }
      .code { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cloud"><span>小</span></div>
    <p class="code">404</p>
    <h1>这个页面走丢了</h1>
    <p>你打开的地址不存在，也可能是链接写错了。<br />回到小了这里接着聊吧。</p>

    <div class="actions">
      <a class="btn btn-primary" href="/index.html">回到小了首页</a>
      <a class="btn btn-ghost" href="/demo.html">看看悬浮版小了</a>
    </div>

    <div class="links">
      <a href="https://read.leleleling.site">了了了读</a>
      <a href="https://game.leleleling.site">了了了游</a>
      <a href="https://leleleling.site">了了了岭工作室</a>
    </div>

    <footer>了了了岭工作室 · 小了</footer>
  </div>
</body>
</html>
