<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./assets/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小了 · 了了了岭工作室 AI 助手</title>
  <meta name="description" content="小了，了了了岭工作室的 AI 助手。可以对话，也可以生成图片。" />
  <link rel="stylesheet" href="./sdk/xiaole-page.css" />
</head>
<body>
  <div class="xlp" id="xl-page"></div>

  <script src="./sdk/xiaole-config.js"></script>
  <script src="./sdk/xiaole-utils.js"></script>
  <script src="./sdk/xiaole-chat.js"></script>
  <script src="./sdk/xiaole-image.js"></script>
  <script src="./sdk/xiaole-page.js"></script>
  <script>
    (function () {
      // 本地联调：?api=http://127.0.0.1:8899/api 可指向代理；线上不传即用默认后端
      var params = new URLSearchParams(location.search);
      var api = params.get('api');
      if (api) window.Xiaole.config.apiBase = api;

      window.Xiaole.chat.setProductPrompt('');
      window.Xiaole.page.init();
    })();
  </script>
